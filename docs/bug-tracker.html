const W={P1:3,P2:2,P3:1},DEF_VELOCITY=8; // effort points/day until measured
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const rows=()=>BASE.map(r=>({...r,...(S[r.id]||{})}));
const pts=r=>W[r.priority]+(r.figma?1:0);
const day=d=>new Date(d+"T00:00:00");
function velocity(rs){const f=rs.filter(r=>r.status==="fixed"&&r.fixedAt);if(f.length<3)return DEF_VELOCITY;
 const t0=Math.min(...f.map(r=>day(r.fixedAt)));const days=Math.max(1,(Date.now()-t0)/864e5);return f.reduce((a,r)=>a+pts(r),0)/days}
function eta(rs,v){const p=rs.reduce((a,r)=>a+pts(r),0);if(!p)return"done";const d=new Date(Date.now()+Math.ceil(p/v)*864e5);return d.toISOString().slice(0,10)+" (~"+Math.ceil(p/v)+"d)"}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function gkey(r,g){return g==="figma"?(r.figma?"Figma required":"No Figma needed"):g==="none"?"All":r[g]}
function render(){
 const all=rows(),v=velocity(all),open=all.filter(r=>r.status==="open");
 const n=s=>all.filter(r=>r.status===s).length;
 sum.innerHTML=[["Total",all.length],["Open",n("open")],["Fixed locally",n("fixed")],["Not a bug",n("not-a-bug")],["Figma-blocked open",open.filter(r=>r.figma).length],["P1 open",open.filter(r=>r.priority==="P1").length],["Velocity pts/day",v.toFixed(1)],["Overall ETA",eta(open,v)]].map(([a,b])=>`<div class="k">${a}<b>${b}</b></div>`).join("");
 const g=grp.value,q=document.getElementById("q").value.toLowerCase();
 let l=all.filter(r=>(!fs.value||r.status===fs.value)&&(!ff.value||(r.figma?"Y":"N")===ff.value)&&(!q||(r.title+r.screen+r.area+r.id).toLowerCase().includes(q)));
 const gs={};l.forEach(r=>(gs[gkey(r,g)]??=[]).push(r));
 const keys=Object.keys(gs).sort();let h="";
 for(const k of keys){const items=gs[k],o=items.filter(r=>r.status==="open");
  if(g!=="none")h+=`<tr class="g"><td colspan="7">${esc(k)} — ${items.length} issues, ${o.length} open · ETA ${eta(o,v)}</td></tr>`;
  for(const r of items)h+=`<tr class="${r.status==="fixed"?"fixed":r.status==="not-a-bug"?"nb":""}"><td class="${r.priority}">${r.priority}</td><td><a href="https://app.clickup.com/t/90161574019/${r.id}" target="_blank" rel="noopener">${esc(r.title)}</a><div class="m">${r.id}</div></td><td>${esc(r.screen)}</td><td>${esc(r.area)}</td><td>${r.figma?"Yes":"No"}</td>
  <td><select data-id="${r.id}" class="st">${["open","fixed","not-a-bug"].map(s=>`<option${s===r.status?" selected":""}>${s}</option>`).join("")}</select>${r.fixedAt?`<div class="m">${r.fixedAt}</div>`:""}</td>
  <td><input data-id="${r.id}" class="nt" value="${esc(r.note||"")}" size="24"></td></tr>`}}
 tb.innerHTML=h||'<tr><td colspan="7">No matches</td></tr>';
}
document.addEventListener("change",e=>{const t=e.target,id=t.dataset.id;if(!id){render();return}
 const s=S[id]=S[id]||{};if(t.classList.contains("st")){s.status=t.value;s.fixedAt=t.value==="fixed"?new Date().toISOString().slice(0,10):null}else s.note=t.value;save();render()});
q.oninput=render;
exp.onclick=()=>{const b=new Blob([JSON.stringify(rows(),null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="bug-tracker.json";a.click()};
rst.onclick=()=>{if(confirm("Discard local edits?")){S={};save();render()}};
render();
