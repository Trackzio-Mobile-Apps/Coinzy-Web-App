const KEY="coinzy-bug-tracker-v1";
const W={P1:3,P2:2,P3:1}, DEF_VELOCITY=8;
let S={}; try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const rows=()=>BASE.map(r=>({...r,...(S[r.id]||{})}));
const pts=r=>W[r.priority]+(r.figma?1:0);
const day=d=>new Date(d+"T00:00:00");
function velocity(rs){
  const f=rs.filter(r=>r.status==="fixed"&&r.fixedAt);
  if(f.length<3) return DEF_VELOCITY;
  const t0=Math.min(...f.map(r=>+day(r.fixedAt)));
  const days=Math.max(1,(Date.now()-t0)/864e5);
  return f.reduce((a,r)=>a+pts(r),0)/days;
}
function etaDate(openPts,v){
  if(!openPts) return {label:"done", iso:null, days:0};
  const days=Math.ceil(openPts/v);
  const d=new Date(Date.now()+days*864e5);
  return {label:d.toISOString().slice(0,10)+" (~"+days+"d)", iso:d.toISOString().slice(0,10), days};
}
function cumulativeEta(items,v){
  // FIFO by priority weight then original order — ETA for each open row as when it would finish
  const open=items.filter(r=>r.status==="open");
  const order=[...open].sort((a,b)=>pts(b)-pts(a));
  let cum=0; const map={};
  for(const r of order){ cum+=pts(r); map[r.id]=etaDate(cum,v).label; }
  return map;
}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function gkey(r,g){return g==="figma"?(r.figma?"Figma required":"No Figma needed"):g==="none"?"All":r[g]}

  const openPts=open.reduce((a,r)=>a+pts(r),0);
  const overall=etaDate(openPts,v);
  const n=s=>all.filter(r=>r.status===s).length;
  sum.innerHTML=[["Total",all.length],["Open",n("open")],["Fixed locally",n("fixed")],["Not a bug",n("not-a-bug")],
    ["Figma-blocked open",open.filter(r=>r.figma).length],["P1 open",open.filter(r=>r.priority==="P1").length],
    ["Velocity pts/day",v.toFixed(1)],["Overall ETA",overall.label]].map(([a,b])=>`<div class="k">${a}<b>${b}</b></div>`).join("");
  const g=grp.value, q=(document.getElementById("q").value||"").toLowerCase();
  let l=all.filter(r=>(!fs.value||r.status===fs.value)&&(!ff.value||(r.figma?"Y":"N")===ff.value)&&(!q||(r.title+r.screen+r.area+r.id+r.note).toLowerCase().includes(q)));
  const gs={}; l.forEach(r=>(gs[gkey(r,g)]??=[]).push(r));
  const keys=Object.keys(gs).sort((a,b)=>{
    if(g==="priority") return a.localeCompare(b);
    return a.localeCompare(b);
  });
  let h="";
  for(const k of keys){
    const items=gs[k], o=items.filter(r=>r.status==="open");
    const oPts=o.reduce((a,r)=>a+pts(r),0);
    const etas=cumulativeEta(items,v);
    if(g!=="none") h+=`<tr class="g"><td colspan="8">${esc(k)} — ${items.length} issues, ${o.length} open · group ETA ${etaDate(oPts,v).label}</td></tr>`;
    for(const r of items){
      const stBadge=r.status==="fixed"?' <span class="badge">fixed</span>':r.status==="not-a-bug"?' <span class="badge">n/a</span>':'';
      h+=`<tr class="${r.status==="fixed"?"fixed":r.status==="not-a-bug"?"nb":""}">
        <td class="${r.priority}">${r.priority}</td>
        <td><a href="https://app.clickup.com/t/90161574019/${r.id}" target="_blank" rel="noopener">${esc(r.title)}</a>${stBadge}<div class="m">${r.id}</div></td>
        <td>${esc(r.screen)}</td><td>${esc(r.area)}</td><td>${r.figma?"Yes":"No"}</td>
        <td><select data-id="${r.id}" class="st">${["open","fixed","not-a-bug"].map(s=>`<option${s===r.status?" selected":""}>${s}</option>`).join("")}</select>${r.fixedAt?`<div class="m">${r.fixedAt}</div>`:""}</td>
        <td class="m">${r.status==="open"?esc(etas[r.id]||"—"):"—"}</td>
        <td><input data-id="${r.id}" class="nt" value="${esc(r.note||"")}" style="width:100%;min-width:160px"></td>
      </tr>`;
    }
  }
  tb.innerHTML=h||'<tr><td colspan="8">No matches</td></tr>';
}
document.addEventListener("change",e=>{
  const t=e.target, id=t.dataset&&t.dataset.id;
  if(!id){ render(); return; }
  const s=S[id]=S[id]||{};
  if(t.classList.contains("st")){ s.status=t.value; s.fixedAt=t.value==="fixed"?new Date().toISOString().slice(0,10):null; }
  else if(t.classList.contains("nt")) s.note=t.value;
  save(); render();
});
document.addEventListener("input",e=>{
  const t=e.target; if(!t.classList||!t.classList.contains("nt")) return;
  const id=t.dataset.id; if(!id) return;
  (S[id]=S[id]||{}).note=t.value; save();
});
q.oninput=render;
exp.onclick=()=>{
  const blob=new Blob([JSON.stringify(rows(),null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="bug-tracker.json"; a.click();
};
imp.onclick=()=>file.click();
file.onchange=async()=>{
  const f=file.files&&file.files[0]; if(!f) return;
  try{
    const arr=JSON.parse(await f.text());
    if(!Array.isArray(arr)) throw new Error("expected array");
    for(const r of arr){ if(!r.id) continue; S[r.id]={status:r.status, note:r.note||"", fixedAt:r.fixedAt||null}; }
    save(); render();
  }catch(err){ alert("Import failed: "+err.message); }
  file.value="";
};
rst.onclick=()=>{ if(confirm("Discard local edits?")){ S={}; save(); render(); } };
render();
</script>
</body>
</html>
