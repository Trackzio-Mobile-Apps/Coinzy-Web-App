[build]
  command = "npm run build"
  publish = ".next"

# ---------------------------------------------------------------------------
# Internal / QA deploy — point your Netlify *internal* site at the `internal` branch.
# Production (`main`) should use a separate site or context with prod API + Firebase.
#
# Also set in Netlify UI for this site (runtime):
#   COINZY_ALLOWED_ORIGINS = https://<your-internal-site>.netlify.app
#   (comma-separate aliases, e.g. custom staging domain)
# Optional: COINZY_EXPERTS_ADMIN_API_KEY for @trackzio.com dummy expert credits.
# ---------------------------------------------------------------------------
[build.environment]
  COINZY_API_ORIGIN = "https://coins-api.trackzio.com"
  COINZY_AUTH_API_ORIGIN = "https://coins-api.trackzio.com"
  COINZY_MARKETPLACE_API_ORIGIN = "https://coins-api.trackzio.com"
  COINZY_EXPERTS_API_ORIGIN = "https://api.coinzy-experts-qa.trackzio.com"

  # coinzy-dev Firebase (debug/staging) — baked into client bundle (NEXT_PUBLIC_*).
  NEXT_PUBLIC_FIREBASE_API_KEY = "AIzaSyBqPVKoGuEl55qm0wagIxKEUTWBzBhhL44"
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN = "coinzy-dev.firebaseapp.com"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID = "coinzy-dev"
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET = "coinzy-dev.firebasestorage.app"
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID = "658935682252"
  NEXT_PUBLIC_FIREBASE_APP_ID = "1:658935682252:web:03f3defa38b2306e741e69"
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID = "G-NSL6S0JE4X"

[[plugins]]
  package = "@netlify/plugin-nextjs"
