[build]
  command = "npm run build"
  publish = ".next"

# Internal / QA — Netlify site `coinzy-web-qa` deploy branch: `internal`.
# Production (`main`) uses separate site `coinzy-web-prod` + prod netlify.toml.

[build.environment]
  # NEXT_PUBLIC_* values are inlined in client JS — never mark them “secret” in Netlify UI.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID,SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES"

  COINZY_API_ORIGIN = "https://coins-api.trackzio.com"
  COINZY_AUTH_API_ORIGIN = "https://coins-api.trackzio.com"
  COINZY_MARKETPLACE_API_ORIGIN = "https://coins-api.trackzio.com"
  COINZY_EXPERTS_API_ORIGIN = "https://api.coinzy-experts-qa.trackzio.com"
  COINZY_ALLOWED_ORIGINS = "https://coinzy-web-qa.netlify.app"

  # coinzy-26a4d web app (same project as Android release). Public client config —
  # do not mark these “secret” in the Netlify UI or the Feed bundle is built without them.
  NEXT_PUBLIC_FIREBASE_API_KEY = "AIzaSyDp5u7EgrZ1NmJs7sBQaBoyG_KdOiA47fg"
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN = "coinzy-26a4d.firebaseapp.com"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID = "coinzy-26a4d"
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET = "coinzy-26a4d.firebasestorage.app"
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID = "1005300770086"
  NEXT_PUBLIC_FIREBASE_APP_ID = "1:1005300770086:web:bc49173769b3460ad9cde7"
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID = "G-6474GBCE3W"

[context.production.environment]
  COINZY_API_ORIGIN = "https://coins-api.trackzio.com"
  COINZY_AUTH_API_ORIGIN = "https://coins-api.trackzio.com"
  COINZY_MARKETPLACE_API_ORIGIN = "https://coins-api.trackzio.com"
  COINZY_EXPERTS_API_ORIGIN = "https://api.coinzy-experts-qa.trackzio.com"
  COINZY_ALLOWED_ORIGINS = "https://coinzy-web-qa.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"
